spring.application.name=ItinerAI

# also read NAME=value lines from an optional, git-ignored .env file in this folder (see README);
# real environment variables take precedence over it
spring.config.import=optional:file:.env[.properties]

# defaults match compose.yaml; override with env vars for any other database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/itinerai}
spring.datasource.username=${DB_USERNAME:itinerai}
spring.datasource.password=${DB_PASSWORD:itinerai}

# placeholder until GOOGLE_MAPS_API_KEY is set in .env or the environment; never commit a real key
itinerai.routing.google-api-key=${GOOGLE_MAPS_API_KEY:placeholder-key}

# fail slow calls to the routing API instead of hanging the request
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=10s
